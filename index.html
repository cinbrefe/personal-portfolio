<html lang="en">

		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta name="theme-color" content="#181A1E" />

		<meta name="description" content="Frontend developer in St. Paul, MN building accessible, responsive interfaces, now in React. Open to remote, mid-level roles." />
		<title>Cindy Brenes | Frontend Developer</title>
		<!-- Link previews (LinkedIn, Slack…). These crawlers don't run JavaScript, so every page shares these tags.
		     No og:url on purpose: a shared project link should keep its own URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Cindy Brenes" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="Cindy Brenes | Frontend Developer" />
		<meta property="og:description" content="Frontend developer in St. Paul, MN building accessible, responsive interfaces, now in React. Open to remote, mid-level roles." />
		<meta property="og:image" content="https://www.cindybrenes.dev/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="cindybrenes.dev" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Cindy Brenes | Frontend Developer" />
		<meta name="twitter:description" content="Frontend developer in St. Paul, MN building accessible, responsive interfaces, now in React. Open to remote, mid-level roles." />
		<meta name="twitter:image" content="https://www.cindybrenes.dev/og-image.png" />
		<meta name="twitter:image:alt" content="cindybrenes.dev" />
		<!-- Tells search engines who the site is about -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Cindy Brenes",
				"jobTitle": "Frontend Developer",
				"url": "https://www.cindybrenes.dev/",
				"address": { "@type": "PostalAddress", "addressLocality": "St. Paul", "addressRegion": "MN", "addressCountry": "US" },
				"knowsLanguage": ["English", "Spanish"],
				"sameAs": ["https://www.linkedin.com/in/cindybrenes", "https://github.com/cinbrefe"]
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
